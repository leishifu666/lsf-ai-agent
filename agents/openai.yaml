interface:
  display_name: "LSF-AI 调度"
  short_description: "通过 Codex CLI、Antigravity CLI、AI Studio、Hark 等委派模型"
  default_prompt: "使用 $lsf-ai-agent，沿用明确指定的产品。Codex CLI 的 GPT-6.2 Sol 极高负责常规编码、修 Bug 和疑难排查跟进，GPT-6.2 Astra 极高负责复杂架构设计和 3D 建模方案，GPT-6 Luna 低档负责批量字段抽取、分类与固定格式整理。代码视频和强动效用 Hark 的 Claude Opus 5.5，新任务开新项目，修订沿用本轮项目，确认无法提交时切普通聊天。用户点名 Claude、Opus 或 Hark 的前端、编程、文案、文档和评审任务也走此入口。文案和文档的撰写、改写与评审默认用 Antigravity CLI 的 Gemini 4 Hydrogen，额度用尽切 AI Studio Hydrogen，点名 Claude 时用 Hark。复杂编程按 CLI Neon、CLI Argon、AI Studio Neon、AI Studio Argon、CLI Hydrogen 顺序切换。CLI 和 AI Studio 的 Gemini 文本模型统一用 High。前端审美用 AI Studio Gemini 3.1 Pro 或 Hark Claude Opus 5.5；常规代码实现优先 DeepSeek，同时开启深度思考和智能搜索。Kimi 用 K3 / 极致，智谱用 GLM-5.3 / 极致。生图用 AI Studio Nano Banana 2.1 的 2K/4K，明确比例。仅明确选择 API 时使用贞贞接口。回收完整结果并在原项目验证。仅修改技能时不发送模型任务。"
